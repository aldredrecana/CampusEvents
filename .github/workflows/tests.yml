name: Tests

# Runs on every push and every pull request, so broken code is caught before merging
on:
    push:
        branches: [main]
    pull_request:

jobs:
    tests:
        runs-on: ubuntu-latest

        steps:
            - name: Get the code
              uses: actions/checkout@v4

            - name: Set up PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.3'
                  extensions: mbstring, pdo_sqlite, pdo_pgsql
                  coverage: none

            - name: Install PHP packages
              run: composer install --no-interaction --prefer-dist --no-progress

            - name: Prepare .env
              run: |
                  cp .env.example .env
                  php artisan key:generate

            - name: Check PHP code style (Pint)
              run: vendor/bin/pint --test

            - name: Run tests
              run: php artisan test

            - name: Set up Node
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: npm

            - name: Build CSS and JS
              run: |
                  npm ci
                  npm run build
